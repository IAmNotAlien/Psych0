name: Materialize PSYCH0 source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psych0-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the uploaded source zip
        id: zip
        run: |
          set -euo pipefail
          if [ -f psych0-source.zip ]; then
            echo "path=psych0-source.zip" >> "$GITHUB_OUTPUT"
          elif compgen -G "*.zip" > /dev/null; then
            echo "path=$(ls *.zip | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No zip at repo root — nothing to materialize (no-op)."
          fi

      - name: Unzip, sanity-check, commit the full tree
        if: steps.zip.outputs.path != ''
        run: |
          set -euo pipefail
          echo "Materializing from: ${{ steps.zip.outputs.path }}"

          rm -rf /tmp/materialize && mkdir -p /tmp/materialize
          unzip -q "${{ steps.zip.outputs.path }}" -d /tmp/materialize

          # tolerate a single wrapper folder (e.g. macOS re-zip)
          cd /tmp/materialize
          if [ ! -f package.json ] && [ "$(ls -A | wc -l)" = "1" ] && [ -d "$(ls -A)" ]; then
            cd "$(ls -A)"
          fi
          test -f package.json || { echo "::error::zip has no package.json at its root"; exit 1; }
          test -d src       || { echo "::error::zip has no src/ directory"; exit 1; }

          # overlay the whole tree (incl. dotfiles) onto the repo root
          cp -a /tmp/materialize/. "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -f psych0-source.zip *.zip
          chmod +x scripts/*.sh 2>/dev/null || true

          git config user.name  "psych0-materializer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PSYCH//OS: materialize full source from uploaded zip"
          git push

          echo "### Materialized 🧠" >> "$GITHUB_STEP_SUMMARY"
          echo "Files now live at the repo root. The zip was removed after unpacking." >> "$GITHUB_STEP_SUMMARY"
